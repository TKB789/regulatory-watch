name: Fetch regulatory feeds

# Runs the feed fetcher every 30 minutes and commits the result.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_feeds.py"
      - ".github/workflows/fetch-feeds.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch feeds
        continue-on-error: true
        run: python scripts/fetch_feeds.py

      - name: Commit updated feed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh feed"
            # Pull any concurrent changes before pushing (handles race conditions)
            git pull --rebase origin main
            git push
          fi
